# Builds the site (page + data prebuilt from the SWI wiki's JSON and supplement.json) and publishes
# it on GitHub Pages. The wiki is read here, server-side, so its CORS rules do not matter; visitors'
# browsers only talk to GitHub Pages.
#
# Runs on every push to main, weekly (the wiki changes rarely; a build is ~900 small requests to
# it), and on demand from the Actions tab.
name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"      # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests that need no game data
        run: |
          node tests/test_optimiser.js
          node tests/test_profile.js
          node tests/test_shared.js
      - name: Build the site from the live wiki
        run: node tools/build_site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
